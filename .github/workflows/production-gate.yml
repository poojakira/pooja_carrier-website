name: Build and Security Gate

on:
  workflow_dispatch:
  # Manual-only in this private repository to avoid unplanned hosted-runner charges.
permissions:
  contents: read

concurrency:
  group: build-security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CAREER_OS_ACCESS_KEY: ci-access-key-only-not-a-production-secret-0001
      CAREER_OS_SESSION_SECRET: ci-session-secret-only-not-production-0001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Development tooling audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::High-severity advisories remain in development/build tooling. Runtime dependencies are audited separately above; critical development advisories remain blocking."
          fi
          npm audit --audit-level=critical
      - name: Security contract
        run: npm test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
