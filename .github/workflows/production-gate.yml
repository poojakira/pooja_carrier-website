name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Security contract
        run: node scripts/verify-security.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          CAREER_OS_ACCESS_KEY: ci-access-key-only-not-a-production-secret-0001
          CAREER_OS_SESSION_SECRET: ci-session-secret-only-not-production-0001
        run: npm run build
