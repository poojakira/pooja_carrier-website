name: One-time dependency remediation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-remediation-once.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Update supported dependency lines
        run: |
          npm install --save-exact next@15.5.25 nodemailer@10.0.10
          npm install --save-dev --save-exact postcss@8.5.28
          npm uninstall --save-dev @types/nodemailer || true
          npm audit fix
      - name: Verify security and application
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run build
      - name: Commit verified dependency update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: update Next.js and mail dependencies"
          git push origin HEAD:main
# trigger: verified dependency remediation
