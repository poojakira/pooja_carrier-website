name: Documentation Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reject unresolved placeholders and merge conflicts
        shell: python
        run: |
          from pathlib import Path
          candidates = [Path("README.md"), Path("SECURITY.md"), Path("RUNBOOK.md"), Path("PRODUCTION.md")]
          forbidden = ("<<<<<<<", "=======", ">>>>>>>", "TODO: FILL", "TBD_METRIC")
          failures = []
          for path in candidates:
              if not path.is_file():
                  continue
              body = path.read_text(encoding="utf-8", errors="replace")
              for marker in forbidden:
                  if marker in body:
                      failures.append(f"{path}: unresolved marker {marker!r}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("documentation integrity verified; honest limitation language is allowed")
