name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAREER_OS_ACCESS_KEY: ci-access-key-only-not-a-production-secret-0001
      CAREER_OS_SESSION_SECRET: ci-session-secret-only-not-production-0001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Security contract
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Check required application routes
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const required = [
            "app/page.tsx",
            "app/api/ai-chat/route.ts",
            "app/api/resume-tweak/route.ts",
            "app/api/send-resume/route.ts",
            "app/api/generate-pdf/route.ts",
          ];
          const missing = required.filter((p) => !fs.existsSync(p));
          if (missing.length) throw new Error("Missing required files: " + missing.join(", "));
          console.log("route smoke checks passed");
          NODE
      - name: Production build
        run: npm run build
