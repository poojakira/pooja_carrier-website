name: CI

on:
  workflow_dispatch:
  # Manual-only in this private repository to avoid unplanned hosted-runner charges.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAREER_OS_ACCESS_KEY: ci-access-key-only-not-a-production-secret-0001
      CAREER_OS_SESSION_SECRET: ci-session-secret-only-not-production-0001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Development tooling audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::High-severity advisories remain in development/build tooling. Runtime dependencies are audited separately above; critical development advisories remain blocking."
          fi
          npm audit --audit-level=critical
      - name: Security contract
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Check required application routes
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const required = [
            "app/page.tsx",
            "app/api/ai-chat/route.ts",
            "app/api/resume-tweak/route.ts",
            "app/api/send-resume/route.ts",
            "app/api/generate-pdf/route.ts",
          ];
          const missing = required.filter((p) => !fs.existsSync(p));
          if (missing.length) throw new Error("Missing required files: " + missing.join(", "));
          console.log("route smoke checks passed");
          NODE
      - name: Production build
        run: npm run build
